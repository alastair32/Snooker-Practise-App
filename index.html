<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single phone-first column, like a scorecard you carry to the table; tabs pinned to the bottom. */
:root {
  --bg: #eef2ee; --surface: #ffffff; --surface-2: #f5f8f5; --fg: #13201a; --muted: #5a6b61; --line: #d6dfd8;
  --accent: #1d6b44; --accent-ink: #ffffff; --accent-soft: #dcebe2;
  --good: #1d7a43; --warn: #a86a00; --bad: #b3261e; --best: #c2410c;
  --ball-red: #c62828; --ball-yellow: #e0aa10; --ball-green: #2e7d32; --ball-brown: #7a4a26;
  --ball-blue: #1e5bb8; --ball-pink: #e46aa0; --ball-black: #1b1b1b;
  --f-display: "Bricolage Grotesque", "Avenir Next Condensed", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b130f; --surface: #131e18; --surface-2: #18251e; --fg: #e4ece6; --muted: #92a399; --line: #26362d;
  --accent: #3fae76; --accent-ink: #06130c; --accent-soft: #1b3326;
  --good: #4cc483; --warn: #e3a63b; --bad: #f2786f; --best: #fb923c;
  --ball-black: #050505; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b130f; --surface: #131e18; --surface-2: #18251e; --fg: #e4ece6; --muted: #92a399; --line: #26362d;
  --accent: #3fae76; --accent-ink: #06130c; --accent-soft: #1b3326;
  --good: #4cc483; --warn: #e3a63b; --bad: #f2786f; --best: #fb923c;
  --ball-black: #050505; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 18px 6px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
.brand svg { flex: none; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync[data-mode="cloud"] i { background: var(--good); }
.sync[data-mode="local"] i { background: var(--warn); }
main { padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 22px; }
body.running main { padding-block-end: calc(24px + env(safe-area-inset-bottom, 0px)); }
body.running nav.tabs { display: none; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 800; line-height: 1.1; }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-num); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card.link { cursor: pointer; }
.card.link:hover { border-color: var(--muted); }
.list { display: grid; gap: 10px; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.drillline { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.drillline .grow { overflow-wrap: anywhere; }
.ball { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; box-shadow: inset -2px -2px 3px rgba(0,0,0,.25), 0 0 0 1px var(--line); }

button, .btn { font: inherit; font-weight: 600; font-size: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 9px 14px; cursor: pointer; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .card.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.big { min-height: 54px; font-size: 17px; padding-inline: 22px; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 10px; }
button.ghost:hover { color: var(--fg); border-color: var(--line); }
button.danger { color: var(--bad); }
button.danger.armed { background: var(--bad); color: var(--surface); border-color: var(--bad); }
button:disabled { opacity: .45; cursor: default; }

label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; min-width: 0; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-height: 42px; width: 100%; min-width: 0; }
textarea { min-height: 70px; resize: vertical; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-radius: 0; min-height: 38px; background: var(--surface); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.entry { display: grid; gap: 10px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; font-weight: 500; border-radius: 999px; border: 1px solid var(--line); padding: 6px 12px; background: var(--surface); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; display: inline-block; white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.mute { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--f-num); font-size: 16px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .target { stroke: var(--warn); stroke-dasharray: 5 4; stroke-width: 1.5; }
.chart .line { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .12; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .dot.last { fill: var(--accent); }
.chart .bestdot { fill: var(--best); }
.chart .bar { fill: var(--accent); }
.chart .bar.now { fill: var(--accent); opacity: .55; }
.chart text.strong { fill: var(--fg); font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; background: var(--accent); border-radius: 2px; }
.legend i.b { width: 9px; height: 9px; border-radius: 50%; background: var(--best); }
.legend i.t { background: none; border-top: 2px dashed var(--warn); height: 0; }

.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* Table diagrams */
.table { display: block; max-width: 100%; height: auto; }
.tablebox { display: flex; justify-content: center; }
.tablebox .table { height: var(--h, min(60vh, 620px)); width: auto; }
.table.edit { touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
.thumb { width: 46px; flex: none; }
.dg-editor { display: grid; gap: 10px; }
.tg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tool { min-height: 38px; font-size: 13px; padding: 6px 11px; }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sw { width: 38px; height: 38px; padding: 0; border-radius: 50%; }
.sw span { width: 22px; height: 22px; border-radius: 50%; display: block; box-shadow: inset -3px -3px 4px rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.35); }
.sw[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 1px; }
.tsep { width: 1px; align-self: stretch; background: var(--line); margin-inline: 2px; }

/* Session runner */
.runhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.timerbox { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.timer { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 54px; font-weight: 700; line-height: 1; }
.timer.over { color: var(--bad); }
.timer.paused { opacity: .5; }
.track { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.track span { display: block; height: 100%; background: var(--accent); width: 0; }
.setupgrid { display: grid; gap: 16px; }
@media (min-width: 760px) { .setupgrid { grid-template-columns: minmax(0, 330px) minmax(0, 1fr); align-items: start; } }
.runcols { display: grid; gap: 16px; }
.panetoggle { display: flex; }
@media (max-width: 859px) {
  .runcols[data-pane="pad"] .pane-ov { display: none; }
  .runcols[data-pane="ov"] .pane-sc { display: none; }
}
@media (min-width: 860px) { .runcols { grid-template-columns: minmax(0, 320px) minmax(0, 1fr); align-items: start; } .panetoggle { display: none; } }
.attempts { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; align-items: center; }
.att { font-family: var(--f-num); font-size: 14px; padding: 3px 9px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.att.top { border-color: var(--best); color: var(--best); }
.display { font-family: var(--f-num); font-size: 44px; font-weight: 700; text-align: center; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); line-height: 1.2; min-height: 66px; }
.display .of { font-size: 20px; color: var(--muted); font-weight: 500; }
.err { color: var(--bad); min-height: 1.4em; font-size: 13px; text-align: center; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pad button { min-height: 60px; font-size: 26px; font-family: var(--f-num); border-radius: 14px; }
.pad button.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-family: var(--f-body); font-size: 18px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 5; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .in { max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { border: 0; border-radius: 0; background: transparent; color: var(--muted); flex-direction: column; gap: 2px; font-size: 11px; font-weight: 600; min-height: 60px; padding: 6px 2px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
/* Camera: a small live view pinned above the tabs while tracking, tap to enlarge */
#camdock { position: fixed; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: min(44vw, 240px); z-index: 15; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 6px 20px rgba(0,0,0,.18); overflow: hidden; }
body.running #camdock { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
#camdock.big { width: min(calc(100vw - 24px), 720px); }
#camdock.mini { width: auto; } #camdock.mini .camwrap, #camdock.mini [data-act="cam-find"] { display: none; }
body.camon main { padding-block-end: calc(190px + env(safe-area-inset-bottom, 0px)); }
body.camon.camsmall main { padding-block-end: calc(70px + env(safe-area-inset-bottom, 0px)); }
#camdock .camwrap { position: relative; background: #000; }
#camdock video, #camdock canvas { display: block; width: 100%; height: auto; }
#camdock canvas { position: absolute; inset: 0; height: 100%; }
#camdock .camline { display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-size: 12px; }
#camdock .camline span { flex: 1; min-width: 0; }
#camdock .camline button { min-height: 30px; padding: 0 8px; font-size: 12px; }
.camdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 4px; vertical-align: middle; }
.camdot.on { background: var(--good); } .camdot.rec { background: var(--bad); }
.scoreboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.player { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; text-align: center; }
.player[aria-current="true"] { border-color: var(--accent); }
.player input { text-align: center; font-weight: 600; }
.player b { font-family: var(--f-num); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.potpad { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.potpad button { min-height: 44px; padding: 0; font-family: var(--f-num); font-weight: 700; color: #fff; border: 0; }
.vidlist a { font-weight: 600; color: var(--accent); }
/* Watching a session on another screen (laptop): feed and score card side by side when there's room */
.watchgrid { display: grid; gap: 14px; grid-template-columns: 1fr; }
.watchgrid[data-v="both"] { grid-template-columns: minmax(0, max-content) minmax(260px, 1fr); }
.watchgrid[data-v="feed"] .wcard, .watchgrid[data-v="card"] .wfeed { display: none; }
@media (max-width: 760px) { .watchgrid[data-v="both"] { grid-template-columns: 1fr; } }
.wfeed { background: #000; border: 3px solid var(--accent); border-radius: var(--r); overflow: hidden; min-height: 200px; min-width: min(100%, 320px); justify-self: center; display: grid; place-items: center; padding: 8px; }
/* Fit the whole feed on screen (a portrait phone feed would otherwise run below the fold) */
.wfeed video { max-width: 100%; max-height: max(240px, calc(100vh - 300px)); width: auto; height: auto; display: block; border-radius: 6px; }
.wfeed p { color: #ccc; padding: 24px; text-align: center; }
.paircode { font-family: var(--f-num); font-size: 44px; font-weight: 700; letter-spacing: .12em; }
.wcard .bigtimer { font-family: var(--f-num); font-size: 48px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.wcard .scoreboard b { font-size: 56px; }
body.watching .wrap { max-width: 1400px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
</style>

      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="var(--ball-red)"/><circle cx="9" cy="9" r="3.5" fill="#fff" opacity=".35"/></svg>
      <span>Practice Log</span>

<script>
(function () {
"use strict";

// ---------- Table geometry (millimetres; portrait, black end at the top, baulk at the bottom) ----------
const TW = 1778, TL = 3569, CX = 889, BY = TL - 737, DR = 292, BR = 44, RAIL = 120; // balls drawn larger than life (real radius 26mm) so diagrams read on a phone
const SPOTS = { yellow: [CX + DR, BY], green: [CX - DR, BY], brown: [CX, BY], blue: [CX, TL / 2], pink: [CX, TL / 4], black: [CX, 324] };
const POCKETS = [[0, 0], [TW, 0], [0, TL / 2], [TW, TL / 2], [0, TL], [TW, TL]];
const BALL_FILL = { cue: "#f4f1e6", red: "#c8102e", yellow: "#f3c300", green: "#159447", brown: "#7a4a1f", blue: "#1f55d6", pink: "#ff86b5", black: "#121212" };
const COLOURS = ["yellow", "green", "brown", "blue", "pink", "black"];
const B = (t, x, y) => ({ t, x: Math.round(x), y: Math.round(y) });
const LN = (x1, y1, x2, y2, dash, arrow = true) => ({ x1: Math.round(x1), y1: Math.round(y1), x2: Math.round(x2), y2: Math.round(y2), dash: !!dash, arrow });
const onSpots = only => (only || COLOURS).map(c => B(c, SPOTS[c][0], SPOTS[c][1]));
const between = (a, b, n) => Array.from({ length: n }, (_, k) => a + (b - a) * (k + 1) / (n + 1));
function pack() {
  const out = [], apexY = SPOTS.pink[1] - 2 * BR - 4, s = 2 * BR + 1;
  for (let r = 0; r < 5; r++) for (let i = 0; i <= r; i++) out.push(B("red", CX + (i - r / 2) * s, apexY - r * s * 0.866));
  return out;
}
const emptyDg = () => ({ balls: [], lines: [], zones: [] });

// ---------- Defaults ----------
const CATS = ["Potting", "Break-building", "Cue ball control", "Sighting/aiming", "Safety", "Long game", "Other"];
const CAT_BALL = { "Potting": "red", "Break-building": "black", "Cue ball control": "pink", "Sighting/aiming": "green", "Safety": "blue", "Long game": "brown", "Other": "yellow" };
const blueY = TL / 2, pinkY = TL / 4;
const DEFAULT_DRILLS = [
  { id: "d-lineup", name: "The Line-up", cat: "Break-building", metric: "break", per: 10, max: "", target: 40, minutes: 20,
    how: "All 15 reds in a line up the middle of the table between the colours, colours on their spots. Play it as a break, red then colour.",

async function connect() {
  if (!window.claude || typeof window.claude.use !== "function") { setSync("local"); return; }
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) { setSync("local"); return; }
    const libRef = db.doc("data/users/" + uid + "/library");
    const logsCol = libRef.collection("logs");
    let libSynced = false, logsSynced = false;
    libRef.onSnapshot(snap => {
      if (snap.exists) {
        const raw = clone(snap.data());
        lib = normalizeLib(raw); LS.set("snk.lib", lib);
        if (!libSynced) { libSynced = true; cloud = cloud || { libRef, logsCol }; setSync("cloud"); }
        if (raw.v !== 2) { const body = clone(lib); queue(() => libRef.set(body)); }
        refresh();
      } else if (!snap.metadata.fromCache && !libSynced) {
        libSynced = true; cloud = cloud || { libRef, logsCol }; setSync("cloud");
        const body = clone(lib); queue(() => libRef.set(body));
      }
    }, () => setSync("local"));
    logsCol.onSnapshot(snap => {
      if (snap.metadata.fromCache && snap.empty) return;
      const remote = snap.docs.map(d => clone(d.data())).filter(l => l && l.id && l.date).map(normLog);
      if (!logsSynced && !snap.metadata.fromCache) {
        logsSynced = true;
        if (!LS.get("snk.migrated")) {
          const have = new Set(remote.map(r => r.id));
          logs.filter(l => !have.has(l.id)).forEach(l => { const b = clone(l); queue(() => logsCol.doc(l.id).set(b)); remote.push(l); });
          LS.set("snk.migrated", true);

    }, () => setSync("local"));
  } catch (e) { console.error(e); setSync("local"); }
}

  }));

  return on ? `<div class="row between"><span class="small"><i class="camdot on"></i>${esc(link.status)}${cam.stream ? " · feed and score card" : " · score card"}</span><button class="ghost" data-act="link-stop">Stop</button></div>`
    : `<p class="small">On the laptop, open the app and choose <b>Watch a session</b>, then enter the code it shows.</p>
      <div class="row"><input id="link-code" inputmode="numeric" maxlength="6" placeholder="6-digit code" value="${esc(link.code)}" style="max-width:160px"><button class="primary" data-act="link-go">Connect</button><button class="ghost" data-act="link-close">Cancel</button></div>
      ${link.status ? `<p class="small muted">${esc(link.status)}</p>` : ""}`;
}
function renderLink() { const c = $("#linkcard"); if (c) c.innerHTML = linkInner(); else if (route === "run" || route === "match") render(); }

// ---------- Actions ----------
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }
function arm(key) {
  armed = key; clearTimeout(armTimer);
  const redraw = () => { if (key === "dg-clear") redrawTools(); else render(); };
  armTimer = setTimeout(() => { if (armed === key) { armed = null; redraw(); } }, 3500);
  redraw();
}
function setPath(obj, path, val) { const ks = path.split("."); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
function startRun(planId, planName, items) { cam.best = {}; cam.session = null; go("run", newRun(planId, planName, items)); }

document.addEventListener("click", ev => {
  const dl = ev.target.closest("a[download]");
  if (dl && NATIVE && blobs[dl.href]) { ev.preventDefault(); saveBlob(blobs[dl.href], dl.getAttribute("download")); return; }
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, i = +b.dataset.i, r = draft;
  switch (act) {
    case "tab": go(id); break;
    case "start": { const p = lib.plans.find(p => p.id === id); if (p) startRun(p.id, p.name, clone(p.items).filter(it => drillById(it.drillId))); break; }
    case "quick-log": startRun(null, "", []); break;
    case "practise": { const d = drillById(id); startRun(null, "", [{ drillId: d.id, minutes: d.minutes }]); break; }
    case "see-progress": progressDrill = id; go("progress"); break;
    case "cancel": {
      if (route === "drill-edit" && lib.drills.some(d => d.id === draft.id)) go("drill", { id: draft.id });
      else go(route === "plan-edit" ? "plans" : route === "drill-edit" ? "drills" : "home");
      break;
    }
    // Plans
    case "new-plan": go("plan-edit", { id: newId("p"), name: "", items: [] }); break;
    case "edit-plan": go("plan-edit", clone(lib.plans.find(p => p.id === id))); break;
    case "add-item": { const d = lib.drills[0]; if (d) draft.items.push({ drillId: d.id, minutes: d.minutes }); render(); break; }
    case "rm-item": draft.items.splice(i, 1); render(); break;
    case "mv": { const j = i + +b.dataset.d; [draft.items[i], draft.items[j]] = [draft.items[j], draft.items[i]]; render(); break; }
    case "save-plan": {
      if (!draft.name.trim()) { toast("Give the session a name."); $("#plan-name").focus(); break; }
      draft.name = draft.name.trim(); draft.items.forEach(it => { it.minutes = +it.minutes || 10; });
      const k = lib.plans.findIndex(p => p.id === draft.id); if (k >= 0) lib.plans[k] = draft; else lib.plans.push(draft);
      saveLib(); toast("Session saved"); go("plans"); break;
    }
    case "del-plan": if (armed !== "plan") { arm("plan"); break; } lib.plans = lib.plans.filter(p => p.id !== draft.id); saveLib(); toast("Session deleted"); go("plans"); break;
    // Drills
    case "view-drill": go("drill", { id }); break;
    case "new-drill": go("drill-edit", { id: newId("d"), name: "", cat: "Potting", metric: "outof", per: 10, max: "", target: "", minutes: 10, how: "", diagram: { balls: onSpots(), lines: [], zones: [] } }); break;
    case "edit-drill": go("drill-edit", clone(drillById(id))); break;
    case "metric": draft.metric = b.dataset.v; render(); break;
    case "save-drill": {
      if (!draft.name.trim()) { toast("Give the drill a name."); $("#dr-name").focus(); break; }
      draft.name = draft.name.trim(); draft.per = Math.max(1, +draft.per || 10); draft.minutes = Math.max(1, +draft.minutes || 10);
      draft.target = draft.target === "" || draft.target == null ? "" : +draft.target; draft.max = draft.max === "" || draft.max == null ? "" : +draft.max;
      const k = lib.drills.findIndex(d => d.id === draft.id); if (k >= 0) lib.drills[k] = draft; else lib.drills.push(draft);
      saveLib(); toast("Drill saved"); go("drill", { id: draft.id }); break;
    }
    case "del-drill":
      if (armed !== "drill") { arm("drill"); break; }
      lib.drills = lib.drills.filter(d => d.id !== draft.id);
      lib.plans.forEach(p => { p.items = p.items.filter(it => it.drillId !== draft.id); });
      saveLib(); toast("Drill deleted"); go("drills"); break;
    // Diagram editor
    case "dg-tool": ed.tool = b.dataset.v; ed.sel = null; redrawSVG(); redrawTools(); break;
    case "dg-spots": pushHist(); draft.diagram.balls = draft.diagram.balls.filter(x => !COLOURS.includes(x.t)).concat(onSpots()); ed.sel = null; redrawSVG(); redrawTools(); break;
    case "dg-pack": pushHist(); draft.diagram.balls = draft.diagram.balls.filter(x => x.t !== "red").concat(pack()); ed.sel = null; redrawSVG(); redrawTools(); break;
    case "dg-snap": ed.snap = !ed.snap; redrawTools(); break;
    case "dg-arrow": ed.arrow = !ed.arrow; if (ed.sel && ed.sel.k === "l") { pushHist(); draft.diagram.lines[ed.sel.i].arrow = ed.arrow; redrawSVG(); } redrawTools(); break;
    case "dg-undo": if (ed.hist.length) { draft.diagram = ed.hist.pop(); ed.sel = null; redrawSVG(); redrawTools(); } break;
    case "dg-del": edDelete(); break;
    case "dg-clear": if (armed !== "dg-clear") { arm("dg-clear"); break; } pushHist(); draft.diagram = emptyDg(); ed.sel = null; armed = null; redrawSVG(); redrawTools(); break;
    // Runner
    case "run-resume": { const p = LS.get("snk.run"); if (p) { if (p.cam) p.cam.on = false; go("run", p); } break; }
    case "run-discard-home": if (armed !== "run-discard") { arm("run-discard"); break; } LS.del("snk.run"); armed = null; render(); break;
    case "run-leave": linkStop(); link.open = false; if (r.phase === "running") camEndDrill(r); camEndSession(); camOff(); if (r.cam) r.cam.on = false; persistRun(); keepAwake(false); go("home"); toast("Session kept. Resume it from Today."); break;
    case "run-start": {
      unlockAudio(); const d = curDrill(r); if (!d) break;
      r.entries.push({ drillId: d.id, drillName: d.name, cat: d.cat, metric: d.metric, per: d.per, scores: [], seconds: 0, plannedMin: +r.items[r.idx].minutes || d.minutes });
      r.cur = r.entries.length - 1; r.phase = "running"; r.started = Date.now(); r.elapsed = 0; r.paused = false; r.beeped = false; r.input = ""; r.pane = "pad";
      keepAwake(true); camBeginDrill(r); if (cam.stream) camMini(true); render(); window.scrollTo(0, 0); break;
    }
    case "run-pause":
      if (r.paused) { r.paused = false; r.started = Date.now(); keepAwake(true); } else { r.elapsed = runElapsed(r); r.paused = true; r.started = null; }
      b.textContent = r.paused ? "Resume" : "Pause"; persistRun(); updateTimer(); break;
    case "run-stop": {
      camEndDrill(r);
      if (r.input && String(r.input).trim()) { const res = validate(r.input, scoringOf(r)); if (!res.err) curEntry(r).scores.push(res.v); }
      stopCurrent(r); advance(r); break;
    }
    case "run-finish": {
      camEndDrill(r);
      if (r.input && String(r.input).trim()) { const res = validate(r.input, scoringOf(r)); if (!res.err) curEntry(r).scores.push(res.v); }
      stopCurrent(r); r.idx = r.items.length; r.phase = "summary"; clearInterval(tick); camEndSession(); persistRun(); render(); window.scrollTo(0, 0); break;
    }
    case "run-skip": advance(r); break;
    case "cam-toggle": {
      r.cam = r.cam || { on: false, save: "none" };
      if (r.cam.on) { r.cam.on = false; camOff(); persistRun(); render(); break; }
      camOn().then(ok => { r.cam.on = ok; if (ok && !LS.get("snk.camtip")) { LS.set("snk.camtip", 1); toast("Keep the phone still once the table is found."); } persistRun(); render(); });
      break;
    }
    case "cam-find": camFind(); break;
    case "watch": go("watch"); break;
    case "w-leave": watchStop(); go("home"); break;
    case "w-new": watchStart(); break;
    case "w-view": watch.view = b.dataset.v; LS.set("snk.wview", watch.view); $(".watchgrid").dataset.v = watch.view; document.querySelectorAll('[data-act="w-view"]').forEach(x => x.setAttribute("aria-pressed", x.dataset.v === watch.view)); break;
    case "link-open": link.open = true; render(); { const i = $("#link-code"); if (i) i.focus(); } break;
    case "link-close": link.open = false; linkStop(); render(); break;
    case "link-go": linkConnect($("#link-code").value); break;
    case "link-stop": linkStop(); link.open = false; render(); break;
    case "cam-big": $("#camdock").classList.toggle("big"); break;
    case "cam-mini": camMini(!$("#camdock").classList.contains("mini")); break;
    case "match": { cam.best = {}; cam.session = null; go("match", { cam: { on: false } }); break; }
    case "m-leave": camOff(); linkStop(); link.open = false; go("home"); break;
    case "m-cam": {
      if (r.cam.on) { r.cam.on = false; camOff(); render(); break; }
      camOn().then(ok => {
        r.cam.on = ok; render(); if (!ok) return;
        const start = () => { if (!cam.stream) return; if (!cam.cal) { setTimeout(start, 500); return; }
          camTrack({ red: 15, yellow: 1, green: 1, brown: 1, blue: 1, pink: 1, black: 1 }, match, false); render(); };
        start();
      });
      break;
    }
    case "m-pot": match.addPot(i); break;
    case "m-foul": match.foul(i); toast(`Foul: ${i} to ${match.players[match.turn].name}`); break;
    case "m-switch": match.switchTurn(); break;
    case "m-undo": match.undo(); break;
    case "m-new": if (armed !== "m-new") { arm("m-new"); break; } armed = null; match.newFrame(); render(); break;
    case "run-end": r.idx = r.items.length; r.phase = "summary"; persistRun(); render(); break;
    case "pane": r.pane = b.dataset.v; persistRun(); render(); break;
    case "pad": {
      const k = b.dataset.k, er = $("#paderr"); if (er) er.textContent = "";
      if (k === "ok") { addScore(r.input); break; }
      const cur = String(r.input || "");
      if (k === "back") r.input = cur.slice(0, -1);
      else if (cur.length < 3) r.input = (cur === "0" ? "" : cur) + k;
      renderScores(); break;
    }
    case "add-score": addScore($("#score-in").value); break;
    case "undo-score": curEntry(r).scores.pop(); persistRun(); renderScores(); break;
    case "run-add": {
      const d = drillById($("#run-add").value); if (!d) break;
      r.items.push({ drillId: d.id, minutes: d.minutes }); r.idx = r.items.length - 1; r.phase = "setup"; persistRun(); render(); window.scrollTo(0, 0); break;
    }
    case "run-save": {
      const total = Math.round(r.entries.reduce((a, e) => a + e.seconds, 0) / 60);
      const log = { id: r.id, date: r.date || todayISO(), planId: r.planId, planName: r.planName, minutes: r.minutes == null || r.minutes === "" ? total : (+r.minutes || 0), notes: r.notes || "", created: r.created,
        entries: r.entries.map(e => ({ drillId: e.drillId, drillName: e.drillName, cat: e.cat, metric: e.metric, per: e.per, scores: e.scores, seconds: e.seconds, plannedMin: e.plannedMin })) };
      saveLog(log); LS.del("snk.run"); camOff(); linkStop(); link.open = false; toast("Session saved"); go("home"); break;
    }
    case "run-discard": if (armed !== "run-discard") { arm("run-discard"); break; } LS.del("snk.run"); keepAwake(false); camOff(); toast("Session discarded"); go("home"); break;
    // History & progress
    case "del-log": if (armed !== "log:" + id) { arm("log:" + id); break; } removeLog(id); armed = null; toast("Session deleted"); render(); break;
    case "pick-drill": progressDrill = id; render(); break;
    // Backup
    case "backup-copy": {
      const txt = backupText();
      const fallback = () => { backupDraft = txt; const ta = $("#backup-text"); ta.value = txt; ta.focus(); ta.select(); toast("Backup is in the box below. Select it all and copy it."); };
      try { navigator.clipboard.writeText(txt).then(() => toast("Backup copied. Paste it somewhere safe, like a note or an email to yourself."), fallback); } catch (e) { fallback(); }
      break;
    }
    case "backup-file": {
      saveBlob(new Blob([backupText()], { type: "application/json" }), "snooker-practice-backup-" + todayISO() + ".json"); break;
    }
    case "backup-restore": {
      let data = null; try { data = JSON.parse(backupDraft); } catch (e) {}
      if (!data || !data.lib || !Array.isArray(data.lib.drills) || !Array.isArray(data.logs)) { toast("That doesn't look like a backup. Paste the whole text you copied."); break; }
      if (armed !== "restore") { arm("restore"); break; }
      lib = normalizeLib(data.lib); saveLib();
      const have = new Set(logs.map(l => l.id));
      data.logs.filter(l => l && l.id && l.date && !have.has(l.id)).map(normLog).forEach(saveLog);
      armed = null; backupDraft = ""; toast("Backup restored"); render(); break;
    }
  }
});
document.addEventListener("keydown", ev => {
  const tgt = ev.target;
  if (tgt && tgt.id === "link-code" && ev.key === "Enter") { ev.preventDefault(); linkConnect(tgt.value); return; }
  if (tgt && tgt.id === "score-in" && ev.key === "Enter") { ev.preventDefault(); addScore(tgt.value); return; }
  if (ev.key === "Enter" && tgt && tgt.classList && tgt.classList.contains("card") && tgt.dataset.act) { tgt.click(); return; }
  if (route === "drill-edit" && ed && ed.sel && (ev.key === "Delete" || ev.key === "Backspace") && !["INPUT", "TEXTAREA", "SELECT"].includes(tgt && tgt.tagName)) { ev.preventDefault(); edDelete(); }
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "backup-text") { backupDraft = el.value; return; }
  if (el.dataset && el.dataset.player != null && match) { match.players[+el.dataset.player].name = el.value; LS.set("snk.match", matchState()); return; }
  if (el.id === "score-in" && draft) { draft.input = el.value; const er = $("#paderr"); if (er) er.textContent = ""; return; }
  if (!el.dataset || !el.dataset.bind || !draft) return;
  setPath(draft, el.dataset.bind, el.value);
  if (el.dataset.total) { const t = $("#plan-total"); if (t) t.textContent = planMinutes(draft) + " min in total"; }
  if (route === "run") persistRun();
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.id === "cam-save" && draft) { draft.cam.save = el.value; persistRun(); return; }
  if (el.id === "backup-file-in" && el.files && el.files[0]) {
    const fr = new FileReader(); fr.onload = () => { backupDraft = String(fr.result || ""); const ta = $("#backup-text"); if (ta) ta.value = backupDraft; toast("Backup file loaded. Tap Restore from backup."); }; fr.readAsText(el.files[0]); return;
  }
  if (!el.dataset || !el.dataset.rerender || !draft) return;
  const m = /^items\.(\d+)\.drillId$/.exec(el.dataset.bind);
  if (m) { const d = drillById(el.value); if (d) draft.items[+m[1]].minutes = d.minutes; }
  render();
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && route === "run" && draft && draft.phase === "running" && !draft.paused) keepAwake(true); });

route = routeFromHash();
render();
connect();
})();
</script>

<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js"));</script>
