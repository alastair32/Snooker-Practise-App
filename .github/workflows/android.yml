# Builds the Android app (APK) and attaches it to the "android-latest" release, so the newest
# APK is always at https://github.com/alastair32/Snooker-Practise-App/releases/tag/android-latest
name: Android APK
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: android-app/build.sh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: practice-log-apk, path: android-app/practice-log.apk }
      - name: Publish the APK on the android-latest release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Android app (latest)" --notes "Download practice-log.apk on your Android phone and open it to install."
          gh release upload android-latest android-app/practice-log.apk --clobber
